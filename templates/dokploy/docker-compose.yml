version: "3.8"

services:
  caddy:
    build:
      context: ../..
      target: caddy
    restart: unless-stopped
    environment:
      API_UPSTREAM: api:8787
      WEB_UPSTREAM: web:3000
      WEB_ROUTES: "/ /login /login/* /register /register/* /two-factor /two-factor/* /account /account/* /users /users/* /dashboard /dashboard/* /links /links/* /api-keys /api-keys/* /settings /settings/* /docs /docs/* /_next/* /robots.txt /sitemap.xml /opengraph-image /favicon.ico"
    expose:
      - "80"
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/api/health"]
      interval: 15s
      timeout: 5s
      start_period: 5s
      retries: 5

  api:
    build:
      context: ../..
      target: api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8787
      DATABASE_URL: postgresql://corto:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/corto
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      REDIS_PREFIX: ${REDIS_PREFIX:-corto:}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL is required}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      SHORT_URL_BASE: ${SHORT_URL_BASE:?SHORT_URL_BASE is required}
      IP_HASH_SECRET: ${IP_HASH_SECRET:?IP_HASH_SECRET is required}
      TRUST_PROXY: "true"
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
    expose:
      - "8787"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const r=await fetch('http://127.0.0.1:8787/api/health');if(!r.ok)process.exit(1)",
        ]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5

  web:
    build:
      context: ../..
      target: web
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL is required}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL is required}
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: corto
      POSTGRES_USER: corto
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - corto-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corto -d corto"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - corto-redis:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'redis-cli --no-auth-warning -a "$${REDIS_PASSWORD}" ping | grep PONG',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  corto-postgres: {}
  corto-redis: {}
